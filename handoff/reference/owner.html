<style id="pf-style">/* Layout: product-site rhythm on a living aurora backdrop. Sticky glass nav, split hero with tilting profile card, bento about grid, project grid, timeline, recognition, socials, contact split. All sizes in rem so the page scales from phones up to 4K. */

/* fluid scaling for large screens: everything is rem-based */
html { font-size: 100%; scroll-behavior: smooth; scroll-padding-top: 5.5rem; }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font-sans); font-size: 1rem; line-height: 1.6;

}

p { margin: 0; }
a { color: inherit; text-decoration: none; }

::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); color: var(--text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 0.375rem; }

}

.accent-word { font-family: var(--font-serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; padding-right: 0.06em;
  background: linear-gradient(100deg, var(--accent), var(--accent-2), var(--accent)); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 8s ease-in-out infinite; }
@keyframes shimmer { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

/* ---------- background ---------- */
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.bg-grid { position: absolute; inset: 0; opacity: var(--grid-o);
  background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 4.5rem 4.5rem;
  -webkit-mask-image: radial-gradient(ellipse 80% 55% at 50% 0%, #000 20%, transparent 75%);
  mask-image: radial-gradient(ellipse 80% 55% at 50% 0%, #000 20%, transparent 75%); }
.bg-grain { position: absolute; inset: -50%; opacity: var(--grain-o); mix-blend-mode: var(--grain-blend);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

#page { position: relative; z-index: 1; }

/* ---------- buttons ---------- */
.btn {

.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 2px 4px rgba(0,0,0,.15), 0 14px 28px -10px color-mix(in srgb, var(--text) 55%, transparent), inset 0 1px 0 rgba(255,255,255,.14); }
.btn-accent { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #fff), var(--accent)); color: var(--accent-fg); box-shadow: 0 8px 20px -8px var(--accent), inset 0 1px 0 rgba(255,255,255,.25); }

.btn-secondary:hover { background: var(--surface-solid); transform: translateY(-1px); }

.btn-icon.btn-sm { width: 2rem; height: 2rem; }
.btn .arrow { transition: transform .3s var(--ease); }
.btn:hover .arrow { transform: translate(2px, -2px); }

/* ---------- nav ---------- */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--nav-bg);

kbd { font-family: var(--font-mono); font-size: 0.6875rem; padding: 0.125rem 0.375rem; border-radius: 0.3rem; background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); }
.seg { display: inline-flex; padding: 0.1875rem; gap: 0.125rem; border-radius: 0.65rem; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border); }
.seg button { width: 1.875rem; height: 1.875rem; display: grid; place-items: center; border: 0; background: transparent; border-radius: 0.45rem; color: var(--text-3); cursor: pointer; transition: color .2s, background-color .2s, box-shadow .2s; font-size: 0.95rem; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface-solid); color: var(--text); box-shadow: var(--shadow-sm), 0 0 0 1px var(--border); }
.seg.wide button { width: auto; padding: 0 0.75rem; font-size: 0.8125rem; display: inline-flex; gap: 0.375rem; }
.edit-btn { position: relative; }
.badge-dot { position: absolute; top: -0.3rem; right: -0.3rem; min-width: 1.125rem; height: 1.125rem; padding: 0 0.3rem; border-radius: 0.6rem; background: var(--accent); color: var(--accent-fg); font-size: 0.6875rem; font-weight: 600; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); }

/* ---------- hero ---------- */
.hero { position: relative; padding-block: 5rem 3.5rem; }
.hero-grid { position: relative; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 0.85fr); gap: 4.5rem; align-items: center; }
.hero-copy { display: flex; flex-direction: column; gap: 1.5rem; min-width: 0; }
.chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 0.5rem; height: 2rem; padding: 0 0.85rem 0 0.7rem;
  border-radius: 999px; background: var(--surface); box-shadow: 0 0 0 1px var(--border), var(--shadow-sm); font-size: 0.8125rem; color: var(--text-2);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.pulse { position: relative; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--ok); }
.pulse::after { content: ""; position: absolute; inset: -0.25rem; border-radius: 50%; background: var(--ok); opacity: .35; animation: pulse 2s var(--ease) infinite; }
@keyframes pulse { 0% { transform: scale(.5); opacity: .5; } 100% { transform: scale(1.7); opacity: 0; } }
.hero h1 { font-size: clamp(2.6rem, 5.4vw, 4.6rem); line-height: 1.02; letter-spacing: -0.045em; font-weight: 600; }

.rotator { font-size: clamp(1.125rem, 1.6vw, 1.375rem); color: var(--text-2); display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.45rem; min-height: 1.6em; }
.rot { position: relative; display: inline-flex; color: var(--text); font-weight: 500; }
.rot span { display: inline-block; transition: transform .5s var(--ease), opacity .5s var(--ease), filter .5s var(--ease); }
.rot span.out { transform: translateY(-60%); opacity: 0; filter: blur(4px); }
.rot span.in { transform: translateY(60%); opacity: 0; filter: blur(4px); transition: none; }
.rot::after { content: ""; position: absolute; left: 0; right: 0; bottom: -0.1em; height: 0.35em; background: var(--accent-soft); border-radius: 0.2em; z-index: -1; }
.hero .lede { font-size: 1.0625rem; color: var(--text-2); max-width: 54ch; line-height: 1.7; }
.cta-row { display: flex; flex-wrap: wrap; gap: 0.625rem; }
.stats { display: flex; flex-wrap: wrap; gap: 1.25rem 0; margin-top: 0.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
.stat { padding-right: 2rem; margin-right: 2rem; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.125rem; }
.stat:last-child { border-right: 0; margin-right: 0; padding-right: 0; }

.card-stage { perspective: 1200px; min-width: 0; }
.profile-card { position: relative; border-radius: var(--r-xl); background: var(--surface); box-shadow: 0 0 0 1px var(--border), var(--shadow-lg), var(--hl);
  overflow: hidden; backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%);
  transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .6s var(--ease); transform-style: preserve-3d; }
.profile-card.tilting { transition: transform .1s linear; }
.profile-card .glare { position: absolute; inset: 0; pointer-events: none; z-index: 3; opacity: 0; transition: opacity .3s;
  background: radial-gradient(500px circle at var(--gx, 50%) var(--gy, 0%), rgba(255,255,255,.18), transparent 40%); }
.profile-card.tilting .glare { opacity: 1; }
.pc-banner { height: 7.5rem; position: relative; overflow: hidden; background: var(--surface-2); }
.pc-banner canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.card-stage { container-type: inline-size; }
.pc-body { padding: 0 1.5rem 1.5rem; display: flex; flex-direction: column; gap: 1.125rem; }
.pc-id, .pc-meta { display: flex; flex-direction: column; gap: 1.125rem; min-width: 0; }

.pc-core { display: flex; flex-direction: column; gap: 0.5rem; }
.pc-avail { display: flex; align-items: center; gap: 0.6rem; font-size: 0.8125rem; color: var(--text-2); padding: 0.75rem 0.875rem; border-radius: var(--r-md); background: var(--ok-soft); }

@container (min-width: 38rem) {
  .pc-banner { height: 8.5rem; }
  .pc-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 2rem; padding: 0 2rem 2rem; }
  .pc-meta { padding-top: 1.5rem; }
  .avatar { width: 6.5rem; height: 6.5rem; margin-top: -3.25rem; font-size: 2rem; }
  .pc-name h3 { font-size: 1.875rem; }
}
.avatar { width: 5.5rem; height: 5.5rem; border-radius: 1.4rem; margin-top: -2.75rem; position: relative; z-index: 1;
  display: grid; place-items: center; font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em; color: #fff;
  background: linear-gradient(145deg, var(--accent-2), var(--accent)); box-shadow: 0 0 0 4px var(--surface-solid), 0 10px 24px -6px rgba(16,18,24,.3); overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.pc-name { display: flex; flex-direction: column; gap: 0.125rem; }

.pc-rows { display: flex; flex-direction: column; border-radius: var(--r-md); background: var(--surface-2); padding: 0.25rem 0.875rem; margin: 0; box-shadow: inset 0 0 0 1px var(--border); }

.pc-row dt { color: var(--text-3); display: flex; align-items: center; gap: 0.5rem; }
.pc-row dd { margin: 0; color: var(--text); font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.pc-social { display: flex; flex-wrap: wrap; gap: 0.5rem; }

  box-shadow: inset 0 0 0 1px var(--border); transition: transform .25s var(--ease), color .2s, background-color .2s, box-shadow .2s; font-size: 1.05rem; border: 0; cursor: pointer; }
.soc-btn:hover { transform: translateY(-2px); color: var(--brand, var(--accent)); background: color-mix(in srgb, var(--brand, var(--accent)) 12%, var(--surface-solid)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand, var(--accent)) 35%, transparent); }
.soc-btn.mono:hover { color: var(--text); background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--border-strong); }
.now-card { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0.875rem; border-radius: var(--r-md);
  border: 1px dashed var(--border-strong); font-size: 0.8125rem; color: var(--text-2); cursor: pointer; background: transparent; text-align: left; width: 100%;
  transition: border-color .2s, background-color .2s; }
.now-card:hover { border-color: var(--accent); background: var(--accent-soft); }
.now-card .lbl { font-family: var(--font-mono); font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--warn); background: var(--warn-soft); padding: 0.125rem 0.375rem; border-radius: 0.3rem; flex: none; }
.now-card b { color: var(--text); font-weight: 500; }

/* ---------- marquee ---------- */
.stack-strip { padding-block: 0.5rem 1.5rem; position: relative; }
.marquee { overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.marquee-track { display: flex; gap: 0.75rem; width: max-content; animation: marquee 50s linear infinite; padding-block: 0.25rem; }
.marquee:hover .marquee-track { animation-play-state: paused; }
@keyframes marquee { to { transform: translateX(calc(-50% - 0.375rem)); } }
.tech { display: inline-flex; align-items: center; gap: 0.6rem; height: 2.75rem; padding: 0 1.1rem 0 0.9rem; border-radius: 999px; background: var(--surface);
  box-shadow: 0 0 0 1px var(--border), var(--shadow-sm); font-size: 0.875rem; color: var(--text-2); white-space: nowrap; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.tech .ti { font-size: 1.15rem; display: inline-flex; }

/* brand icon colouring */
.ti { color: var(--brand, var(--text-2)); display: inline-flex; align-items: center; justify-content: center; }
.ti.mono { color: var(--text); }
.mono-ico { display: inline-grid; place-items: center; width: 1.25em; height: 1.25em; border-radius: 0.3em; background: var(--accent-soft); color: var(--accent); font-size: 0.75em; font-weight: 700; letter-spacing: -0.02em; font-family: var(--font-mono); }

/* ---------- sections ---------- */
section.block { padding-block: 5.5rem; position: relative; }
.sec-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1.25rem; margin-bottom: 2.5rem; }
.sec-head > div { display: flex; flex-direction: column; gap: 0.75rem; max-width: 42rem; }
.eyebrow { display: inline-flex; align-items: center; gap: 0.5rem; font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent); }
.eyebrow::before { content: ""; width: 1.25rem; height: 1px; background: currentColor; opacity: .6; }
.sec-head h2 { font-size: clamp(2rem, 3.6vw, 2.75rem); line-height: 1.06; letter-spacing: -0.04em; }
.sec-head p { color: var(--text-2); font-size: 1rem; max-width: 56ch; }
.sec-edit { align-self: flex-end; }

.card { position: relative; background: var(--surface); border-radius: var(--r-lg); box-shadow: 0 0 0 1px var(--border), var(--shadow-md), var(--hl);
  overflow: hidden; isolation: isolate; min-width: 0; backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.card.spot::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity .35s;
  background: radial-gradient(28rem circle at var(--mx, 50%) var(--my, 50%), var(--accent-soft), transparent 45%); }
.card.spot::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; opacity: 0; transition: opacity .35s;
  background: radial-gradient(18rem circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--accent) 55%, transparent), transparent 60%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.card.spot:hover::before, .card.spot:hover::after { opacity: 1; }

/* bento */
.bento { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1rem; }
.bento .card { padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
.b-about { grid-column: span 4; }
.b-loc { grid-column: span 2; }
.b-skill { grid-column: span var(--span, 2); }
.b-half { grid-column: span 3; }
.b-full { grid-column: span 6; }
.card-label { font-size: 0.8125rem; color: var(--text-3); display: flex; align-items: center; gap: 0.5rem; }
.b-about .about-text { display: flex; flex-direction: column; gap: 0.85rem; }
.b-about p { font-size: 1.0625rem; color: var(--text-2); line-height: 1.75; max-width: 64ch; }
.b-about p:first-child { color: var(--text); font-size: 1.1875rem; line-height: 1.6; letter-spacing: -0.01em; }
.clock { font-size: 2.75rem; font-weight: 500; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; line-height: 1; }
.clock small { font-size: 0.875rem; color: var(--text-3); letter-spacing: 0; margin-left: 0.375rem; font-weight: 400; }
.loc-meta { display: flex; flex-direction: column; gap: 0.25rem; color: var(--text-2); font-size: 0.875rem; margin-top: auto; }
.daybar { height: 0.375rem; border-radius: 0.2rem; background: var(--surface-3); position: relative; }
.daybar span { position: absolute; top: 50%; width: 0.75rem; height: 0.75rem; margin-left: -0.375rem; margin-top: -0.375rem; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--surface-solid), 0 0 12px var(--accent); }
.daybar::before { content: ""; position: absolute; left: 37.5%; width: 37.5%; top: 0; bottom: 0; border-radius: 0.2rem; background: color-mix(in srgb, var(--accent) 22%, transparent); }
.skill-title { display: flex; align-items: center; justify-content: space-between; }
.skill-title h3 { font-size: 1rem; letter-spacing: -0.01em; }
.skill-title .count { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-3); }
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.75rem, 1fr)); gap: 0.5rem; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 0.45rem; padding: 0.85rem 0.25rem 0.6rem; border-radius: 0.85rem; background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--border); text-align: center; font-size: 0.71875rem; color: var(--text-2); line-height: 1.2;
  transition: transform .3s var(--ease), box-shadow .3s, background-color .3s; min-width: 0; }
.tool .ti { font-size: 1.6rem; height: 1.6rem; transition: transform .35s var(--ease), filter .35s; }
.tool .mono-ico { font-size: 1.4rem; }
.tool span:last-child { overflow-wrap: anywhere; }
.tool:hover { transform: translateY(-3px); background: color-mix(in srgb, var(--brand, var(--accent)) 9%, var(--surface-solid)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand, var(--accent)) 30%, transparent), 0 10px 20px -12px var(--brand, var(--accent)); }
.tool:hover .ti { transform: scale(1.12); filter: drop-shadow(0 4px 10px color-mix(in srgb, var(--brand, var(--accent)) 50%, transparent)); }
.pills { display: flex; flex-wrap: wrap; gap: 0.375rem; }
.pill { display: inline-flex; align-items: center; gap: 0.4rem; height: 1.875rem; padding: 0 0.7rem; border-radius: 0.55rem; background: var(--surface-2); color: var(--text-2); font-size: 0.8125rem; box-shadow: inset 0 0 0 1px var(--border); }
.pill .ti { font-size: 0.95rem; }
.learn-row { display: flex; flex-direction: column; gap: 0.85rem; }
.learn-row h3 { font-size: 1rem; display: flex; align-items: center; gap: 0.5rem; }
.learn-row h3 .ico { color: var(--accent); }
.learn-row.alt h3 .ico { color: var(--ok); }

/* projects */
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 21rem), 1fr)); gap: 1.25rem; }
.proj { display: flex; flex-direction: column; cursor: pointer; text-align: left; border: 0; padding: 0; color: inherit; transition: transform .45s var(--ease), box-shadow .45s var(--ease); }
.proj:hover { transform: translateY(-6px); box-shadow: 0 0 0 1px var(--border), var(--shadow-lg), var(--hl); }
.cover { position: relative; aspect-ratio: 16 / 10; max-width: 100%; overflow: hidden; background: hsl(var(--h) 45% var(--cover-bg-l)); }
.cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease); }
.proj:hover .cover-img { transform: scale(1.05); }
.cover-mesh { position: absolute; inset: -20%;
  background: radial-gradient(40% 50% at 20% 30%, hsl(var(--h) 85% var(--cover-l) / .6), transparent 70%),
              radial-gradient(45% 55% at 85% 75%, hsl(calc(var(--h) + 45) 85% var(--cover-l) / .5), transparent 70%),
              radial-gradient(30% 40% at 60% 10%, hsl(calc(var(--h) - 40) 85% var(--cover-l) / .35), transparent 70%);
  transition: transform 1s var(--ease); }
.proj:hover .cover-mesh { transform: scale(1.1) rotate(3deg); }
.window { position: absolute; left: 12%; right: 12%; top: 18%; bottom: -8%; border-radius: 0.65rem; background: var(--surface-solid);
  box-shadow: 0 24px 48px -14px rgba(0,0,0,.35), 0 0 0 1px var(--border); display: flex; flex-direction: column; overflow: hidden; transition: transform .6s var(--ease); }
.proj:hover .window { transform: translateY(-8px); }
.win-bar { height: 1.375rem; display: flex; align-items: center; gap: 0.3rem; padding: 0 0.55rem; border-bottom: 1px solid var(--border); background: var(--surface-3); }
.win-bar i { width: 0.45rem; height: 0.45rem; border-radius: 50%; background: var(--border-strong); }
.win-body { flex: 1; display: grid; grid-template-columns: 26% 1fr; }
.win-side { border-right: 1px solid var(--border); padding: 0.6rem 0.5rem; display: flex; flex-direction: column; gap: 0.375rem; }
.win-side i, .win-main i { display: block; height: 0.375rem; border-radius: 0.2rem; background: var(--surface-3); }
.win-side i:first-child { background: hsl(var(--h) 70% var(--cover-l) / .7); width: 70%; }
.win-main { padding: 0.75rem; display: flex; flex-direction: column; gap: 0.45rem; }
.win-main .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.375rem; margin-bottom: 0.25rem; }
.win-main .tiles b { height: 1.6rem; border-radius: 0.3rem; background: var(--surface-3); }
.win-main .tiles b:first-child { background: hsl(var(--h) 70% var(--cover-l) / .3); }
.proj-body { padding: 1.25rem 1.375rem 1.375rem; display: flex; flex-direction: column; gap: 0.65rem; flex: 1; }
.proj-top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
.proj-top h3 { font-size: 1.1875rem; letter-spacing: -0.025em; }
.status { display: inline-flex; align-items: center; gap: 0.375rem; height: 1.5rem; padding: 0 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 500; white-space: nowrap; }
.status::before { content: ""; width: 0.375rem; height: 0.375rem; border-radius: 50%; background: currentColor; }
.status.live { color: var(--ok); background: var(--ok-soft); }
.status.wip { color: var(--warn); background: var(--warn-soft); }
.status.archived { color: var(--text-3); background: var(--surface-2); }
.proj-body > p { color: var(--text-2); font-size: 0.9375rem; line-height: 1.6; }
.proj-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-top: auto; padding-top: 0.5rem; }
.stack-icons { display: flex; flex-wrap: wrap; gap: 0.375rem; min-width: 0; }
.si-tile { width: 2rem; height: 2rem; border-radius: 0.55rem; display: grid; place-items: center; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border); font-size: 1rem; position: relative; }
.si-tile .mono-ico { font-size: 0.95rem; }
.si-more { font-size: 0.75rem; color: var(--text-3); font-family: var(--font-mono); }
[data-tip] { position: relative; }
[data-tip]:hover::after, [data-tip]:focus-visible::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 0.4rem); left: 50%; transform: translateX(-50%); white-space: nowrap;
  background: var(--text); color: var(--bg); font-size: 0.6875rem; font-weight: 500; padding: 0.25rem 0.5rem; border-radius: 0.4rem; z-index: 5; pointer-events: none; font-family: var(--font-sans); }
.proj-year { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-3); flex: none; }
.empty-state { grid-column: 1 / -1; padding: 3rem 1.5rem; text-align: center; color: var(--text-3); border: 1px dashed var(--border-strong); border-radius: var(--r-lg); display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }

/* timeline */
.timeline { display: grid; grid-template-columns: minmax(0, 1fr); position: relative; }
.job { display: grid; grid-template-columns: 12.5rem 2rem minmax(0, 1fr); gap: 0 1.5rem; position: relative; }
.job-when { padding-top: 1.4rem; display: flex; flex-direction: column; gap: 0.125rem; text-align: right; }
.job-when b { font-weight: 500; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
.job-when span { font-size: 0.8125rem; color: var(--text-3); }
.job-rail { position: relative; display: flex; justify-content: center; }
.job-rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 1px; background: linear-gradient(var(--border-strong), var(--border-strong)); }
.job:first-child .job-rail::before { top: 1.9rem; background: linear-gradient(var(--accent), var(--border-strong) 60%); }
.job:last-child .job-rail::before { bottom: calc(100% - 1.9rem); }
.job:only-child .job-rail::before { display: none; }
.job-dot { position: relative; margin-top: 1.5rem; width: 0.8rem; height: 0.8rem; border-radius: 50%; background: var(--surface-solid); box-shadow: 0 0 0 1px var(--border-strong), 0 0 0 5px var(--bg); }
.job.current .job-dot { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), 0 0 0 7px var(--bg), 0 0 18px var(--accent); }
.job-card { margin-bottom: 1rem; padding: 1.25rem 1.375rem; }
.job-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
.job-head h3 { font-size: 1.125rem; letter-spacing: -0.02em; }
.job-head .co { color: var(--text-2); font-size: 0.875rem; margin-top: 0.125rem; display: flex; align-items: center; gap: 0.375rem; flex-wrap: wrap; }
.job-card > p { margin-top: 0.625rem; color: var(--text-2); font-size: 0.9375rem; max-width: 68ch; }
.bullets { margin: 0.875rem 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
.bullets li { display: grid; grid-template-columns: 1rem 1fr; gap: 0.625rem; font-size: 0.9375rem; color: var(--text-2); }
.bullets li::before { content: ""; width: 0.375rem; height: 0.375rem; border-radius: 50%; background: var(--accent); opacity: .7; margin: 0.6rem 0 0 0.25rem; }
.toggle-more { margin-top: 0.75rem; display: inline-flex; align-items: center; gap: 0.375rem; font-size: 0.8125rem; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 0; }
.toggle-more .ico { transition: transform .25s var(--ease); }
.toggle-more[aria-expanded="true"] .ico { transform: rotate(180deg); }

/* testimonials */
.quote-card { margin: 0; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
.qmark { width: 1.75rem; height: auto; fill: var(--accent); opacity: .85; }
.quote-card blockquote { margin: 0; font-size: 1rem; line-height: 1.7; color: var(--text); white-space: pre-line; }
.quote-card blockquote.clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.quote-card .toggle-more { margin-top: -0.5rem; align-self: flex-start; }
.quote-card figcaption { display: flex; align-items: center; gap: 0.75rem; margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border); }
.q-av { width: 2.75rem; height: 2.75rem; border-radius: 50%; flex: none; display: grid; place-items: center; overflow: hidden; font-weight: 600; font-size: 0.875rem; color: #fff; background: linear-gradient(140deg, var(--accent-2), var(--accent)); box-shadow: 0 0 0 3px var(--surface-solid); }
.q-av img { width: 100%; height: 100%; object-fit: cover; }
.q-who { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.35; }
.q-who b { font-size: 0.9375rem; font-weight: 600; }
.q-who span { font-size: 0.8125rem; color: var(--text-2); overflow-wrap: anywhere; }
.q-who small { font-size: 0.75rem; color: var(--text-3); margin-top: 0.125rem; }
.q-li { color: var(--brand); flex: none; }
.quote-card.featured { padding: 2.25rem 2.5rem; margin-bottom: 1rem; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.5rem 1.75rem; }
.quote-card.featured .qmark { width: 3rem; grid-row: span 3; }
.quote-card.featured blockquote { font-family: var(--font-serif); font-size: clamp(1.25rem, 1.9vw, 1.75rem); line-height: 1.45; letter-spacing: -0.01em; }
.quote-card.featured .toggle-more { margin-top: 0; }
.quotes { columns: 3 19rem; column-gap: 1rem; }
.quotes .quote-card { break-inside: avoid; margin-bottom: 1rem; width: 100%; }
.quotes.few { columns: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); gap: 1rem; }
.quotes.few .quote-card { margin-bottom: 0; }
.quote-ghost { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: 1rem; }
.quote-ghost .quote-card { opacity: .7; border: 1px dashed var(--border-strong); }
.quote-ghost .empty-state { grid-column: auto; justify-content: center; }
@media (max-width: 720px) { .quote-card.featured { grid-template-columns: minmax(0, 1fr); padding: 1.5rem; } .quote-card.featured .qmark { grid-row: auto; width: 2.25rem; } .quote-card.featured blockquote { font-size: 1.1875rem; } }

/* achievements */
.awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: 1rem; }
.award { padding: 1.375rem; display: flex; flex-direction: column; gap: 0.75rem; }
.award-top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
.medal { width: 3rem; height: 3rem; border-radius: 0.9rem; display: grid; place-items: center; font-size: 1.35rem; color: #fff;
  background: linear-gradient(140deg, var(--m1, var(--accent-2)), var(--m2, var(--accent))); box-shadow: 0 10px 24px -10px var(--m2, var(--accent)), inset 0 1px 0 rgba(255,255,255,.35); }
.medal.gold { --m1: #f7c66b; --m2: #d48a12; }
.medal.silver { --m1: #d7dbe3; --m2: #8a93a5; }
.medal.bronze { --m1: #e8a37a; --m2: #a85a2c; }
.award-badge { font-size: 0.71875rem; font-weight: 600; padding: 0.2rem 0.55rem; border-radius: 999px; color: var(--accent); background: var(--accent-soft); white-space: nowrap; }
.award h3 { font-size: 1.0625rem; letter-spacing: -0.02em; }
.award .meta { font-size: 0.8125rem; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 0.25rem 0.5rem; }
.award p { font-size: 0.9375rem; color: var(--text-2); }
.text-link { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.8125rem; color: var(--accent); font-weight: 500; margin-top: auto; }
.text-link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* certifications */
.certs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 24rem), 1fr)); gap: 1rem; }
.cert { padding: 1.125rem 1.25rem; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 1rem; align-items: center; }
.cert-logo { width: 3.25rem; height: 3.25rem; border-radius: 0.9rem; display: grid; place-items: center; font-size: 1.6rem; background: var(--surface-solid); box-shadow: inset 0 0 0 1px var(--border), var(--shadow-sm); }
.cert-logo .mono-ico { font-size: 1.3rem; }
.cert-info { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
.cert-info h3 { font-size: 1rem; letter-spacing: -0.015em; }
.cert-info .issuer { font-size: 0.875rem; color: var(--text-2); }
.cert-info .meta { font-size: 0.75rem; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; font-variant-numeric: tabular-nums; }
.cert-info .meta button { background: none; border: 0; padding: 0; color: var(--text-3); cursor: pointer; font-family: var(--font-mono); font-size: 0.75rem; display: inline-flex; align-items: center; gap: 0.25rem; }
.cert-info .meta button:hover { color: var(--text); }
.verified { display: inline-flex; align-items: center; gap: 0.25rem; color: var(--ok); }

/* socials */
.socials { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr)); gap: 1rem; }
button.social { border: 0; font: inherit; text-align: left; cursor: pointer; width: 100%; }
.social { padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; color: inherit; transition: transform .4s var(--ease), box-shadow .4s var(--ease); }
.social:hover { transform: translateY(-4px); box-shadow: 0 0 0 1px color-mix(in srgb, var(--brand, var(--accent)) 40%, transparent), 0 20px 40px -20px var(--brand, var(--accent)), var(--hl); }
.social-top { display: flex; align-items: flex-start; justify-content: space-between; }
.social-ico { width: 3rem; height: 3rem; border-radius: 0.9rem; display: grid; place-items: center; font-size: 1.4rem;
  background: color-mix(in srgb, var(--brand, var(--accent)) 12%, var(--surface-solid)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand, var(--accent)) 22%, transparent); transition: transform .4s var(--ease); }

    Promise.all([window.claude.use('user'), window.claude.use('artifact'), window.claude.use('db'), window.claude.use('assets')]).then(function (r) {
      state.user = r[0]; state.artifact = r[1]; state.db = r[2]; state.assets = r[3];
      return (state.user ? state.user.canEdit() : Promise.resolve(false)).then(function (canEdit) {
        state.isEditor = !!(canEdit && state.artifact);
        if (state.isEditor && state.db) {
          state.db.collection('messages').onSnapshot(function (snap) {
            state.messages = snap.docs.map(function (d) { return d.data() || {}; }).sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
            if ($('#drawer').classList.contains('open') && state.tab === 'messages') renderDrawer();
            var eb = $('.edit-btn'); if (eb) { var bd = $('.badge-dot', eb); if (state.messages.length) { if (!bd) { bd = document.createElement('span'); bd.className = 'badge-dot'; eb.appendChild(bd); } bd.textContent = state.messages.length; } else if (bd) bd.remove(); }
          }, function () {});
        }
        if (!$('#drawer').classList.contains('open')) renderPage();
      });
    }).catch(function () {});
  }
})();
</script>
</body></html>
